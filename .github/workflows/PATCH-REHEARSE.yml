name: PATCH-REHEARSE

on:
  workflow_dispatch:

jobs:
  rehearse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CI project
        uses: actions/checkout@main

      - name: Clone immortalwrt main
        run: |
          git clone --depth=1 --branch main https://github.com/VIKINGYFY/immortalwrt.git ./wrt

      - name: Download kernel source
        run: |
          # 版本号取自 owrt 分支（与编译时内核对齐目标一致），补丁集来自 main
          KVER_RAW=$(curl -fsSL --retry 3 "https://raw.githubusercontent.com/VIKINGYFY/immortalwrt/owrt/target/linux/generic/kernel-6.18" \
            | grep -oP '^LINUX_VERSION-6\.18 = \K\S+')
          if [ -z "$KVER_RAW" ]; then
            echo "无法读取 owrt 内核版本定义，演练终止"
            exit 1
          fi
          KVER="6.18$KVER_RAW"
          echo "内核版本: $KVER"
          curl -fsSL --retry 3 -o /tmp/linux.tar.xz "https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-$KVER.tar.xz"
          mkdir -p /tmp/linux
          tar xf /tmp/linux.tar.xz -C /tmp/linux --strip-components=1
          # 复刻编译时行为：先覆盖 files/ 目录（部分补丁的上下文可能来自覆盖文件）
          mkdir -p ./wrt/target/linux/generic/files ./wrt/target/linux/qualcommax/files
          cp -a ./wrt/target/linux/generic/files/. ./wrt/target/linux/qualcommax/files/. /tmp/linux/ 2>/dev/null || true

      - name: Rehearse all patches
        run: |
          KT=/tmp/linux
          RETIRED_FILE="$GITHUB_WORKSPACE/Scripts/retired-patches.txt"
          if [ ! -f "$RETIRED_FILE" ]; then
            echo "缺少退役补丁清单 $RETIRED_FILE，演练终止"
            exit 1
          fi
          # 与编译脚本共用同一份清单：按 basename 精确匹配跳过
          SKIP_LIST=""
          while IFS= read -r L || [ -n "$L" ]; do
            L=$(echo "$L" | tr -d '\r' | sed 's/[[:space:]]*$//')
            [ -z "$L" ] && continue
            case "$L" in \#*) continue ;; esac
            SKIP_LIST="$SKIP_LIST $(basename "$L")"
          done < "$RETIRED_FILE"
          echo "跳过清单: $SKIP_LIST"
          cd ./wrt
          patch --version | head -1
          git -C $KT init -q && git -C $KT config user.name rehearse && git -C $KT config user.email rehearse@local && git -C $KT add -A && git -C $KT commit -qm vanilla
          for DIR in generic/backport-6.18 generic/pending-6.18 generic/hack-6.18 qualcommax/patches-6.18; do
            for P in target/linux/$DIR/*.patch; do
              [ -e "$P" ] || continue
              BASE=$(basename "$P")
              case " $SKIP_LIST " in
                *" $BASE "*) echo "SKIP(已退役): $DIR/$BASE"; continue ;;
              esac
              # --forward 关键：禁止 GNU patch 静默反向应用（与编译时 plaintext 行为一致）
              if patch -d $KT -p1 --batch --forward --silent < "$P" >/dev/null 2>&1; then
                continue
              fi
              FILES=$(grep -E '^(\+\+\+|---) [ab]/' "$P" | sed -E 's#^[+-]{3} [ab]/##' | sort -u)
              for F in $FILES; do git -C $KT checkout -q -- "$F" 2>/dev/null || true; done
              find $KT \( -name '*.rej' -o -name '*.orig' \) -delete
              if patch -d $KT -p1 -R --dry-run --forward --silent < "$P" >/dev/null 2>&1; then
                echo "RETIRED(已吸收): $DIR/$BASE"
              else
                echo "CONFLICT(真冲突): $DIR/$BASE"
              fi
            done
          done
          echo "===== 演练完成 ====="
