name: PATCH-REHEARSE

on:
  workflow_dispatch:

jobs:
  rehearse:
    runs-on: ubuntu-latest
    steps:
      - name: Clone immortalwrt main
        run: |
          git clone --depth=1 https://github.com/VIKINGYFY/immortalwrt.git ./wrt

      - name: Download kernel source
        run: |
          KVER=$(grep -oP '^LINUX_VERSION-6\.18 = \K\S+' ./wrt/target/linux/generic/kernel-6.18)
          echo "内核版本: $KVER"
          curl -sL -o /tmp/linux.tar.xz "https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-$KVER.tar.xz"
          mkdir -p /tmp/linux
          tar xf /tmp/linux.tar.xz -C /tmp/linux --strip-components=1

      - name: Rehearse all patches
        run: |
          KT=/tmp/linux
          cd ./wrt
          patch --version | head -1
          git -C $KT init -q && git -C $KT add -A && git -C $KT commit -qm vanilla
          for DIR in generic/backport-6.18 generic/pending-6.18 generic/hack-6.18 qualcommax/patches-6.18; do
            for P in target/linux/$DIR/*.patch; do
              [ -e "$P" ] || continue
              if patch -d $KT -p1 --batch --silent < "$P" >/dev/null 2>&1; then
                continue
              fi
              FILES=$(grep -E '^(\+\+\+|---) [ab]/' "$P" | sed -E 's#^[+-]{3} [ab]/##' | sort -u)
              for F in $FILES; do git -C $KT checkout -q -- "$F" 2>/dev/null || true; done
              find $KT \( -name '*.rej' -o -name '*.orig' \) -delete
              if patch -d $KT -p1 -R --dry-run --silent < "$P" >/dev/null 2>&1; then
                echo "RETIRED(已吸收): $DIR/$(basename "$P")"
              else
                echo "CONFLICT(真冲突): $DIR/$(basename "$P")"
              fi
            done
          done
          echo "===== 演练完成 ====="
